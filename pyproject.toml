[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-infer"
version = "0.1.0"
description = "A tiny, readable LLM inference engine: paged KV cache, continuous batching, prefix caching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.5", "safetensors", "transformers>=4.56", "huggingface_hub", "tqdm"]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
test = ["pytest", "httpx", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
include = ["nanoinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
